# Alembic configuration. The database URL is NOT set here: migrations/env.py reads it
# from app.config (MIGRATIONS_DATABASE_URL, falling back to DATABASE_URL), so secrets
# never live in this file.

[alembic]
script_location = %(here)s/migrations
# Readable, sequential file names: 0001_create_schemas.py, 0002_...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
