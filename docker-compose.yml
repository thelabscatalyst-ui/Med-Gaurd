# Local development stack. Production does NOT use this file (Cloud Run + Cloud SQL).
#   docker compose up -d --build     # db + api
#   docker compose up -d db          # just the database, run the API with `uv run`
name: medguard

services:
  db:
    # Pinned: the pgvector version decides which index features exist (iterative scan
    # needs >= 0.8). Keep this in step with what Cloud SQL ships.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: medguard
      POSTGRES_PASSWORD: medguard  # local-only credential, never used in the cloud
      POSTGRES_DB: medguard
    ports:
      - "5433:5432"  # 5433 on the host so it can't clash with another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medguard -d medguard"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-off job: apply migrations, then exit. Same image as the API, different command
  # (in the cloud this becomes a Cloud Run Job that runs before each deploy).
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://medguard:medguard@db:5432/medguard
      MIGRATIONS_DATABASE_URL: postgresql://medguard:medguard@db:5432/medguard
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://medguard:medguard@db:5432/medguard
      ENVIRONMENT: local
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully  # never serve an un-migrated database

volumes:
  pgdata:
